  /ai/insights:
    get:
      operationId: getAiInsights
      tags: [ai]
      summary: AI-generated business insights and alerts
      parameters:
        - name: companyId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiInsight"

