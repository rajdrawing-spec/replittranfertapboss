      operationId: getAttendanceSummary
      tags: [employees]
      summary: Attendance summary (present/absent/leave today)
      parameters:
        - name: companyId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Attendance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"

  # ─── Customers ───────────────────────────────────────────────────
  /customers:
