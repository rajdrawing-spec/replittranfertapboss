          type: string
        updatedAt:
          type: string

    ApprovalInput:
      type: object
      required: [companyId, type, title, description, requestedBy]
      properties:
        companyId:
          type: integer
        type:
          type: string
          enum: [payment, purchase, refund, hiring, salary, vendor, leave, expense]
        title:
          type: string
        description:
          type: string
        requestedBy:
          type: string
        amount:
          type: number
        dueDate:
          type: string

    ApprovalAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        note:
          type: string

    ApprovalList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ─── AI ────────────────────────────────────────────────────────
    AiChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        companyId:
          type: ["integer", "null"]
        context:
          type: ["string", "null"]

    AiChatResult:
      type: object
      required: [response, timestamp]
      properties:
        response:
          type: string
        timestamp:
          type: string
        dataPoints:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
              value:
                type: string

    AiInsight:
      type: object
      required: [id, type, title, description, severity, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [low_inventory, overdue_payment, revenue_opportunity, compliance, expense_anomaly, sales_trend]
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        companyName:
          type: ["string", "null"]
        actionLabel:
          type: ["string", "null"]
        actionUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    # ─── Users ─────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, companyIds, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, founder, director, finance, operations, hr, marketing, customer_support, warehouse, vendor, ca, employee, investor]
        companyIds:
          type: array
          items:
            type: integer
        avatarUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        lastLoginAt:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, founder, director, finance, operations, hr, marketing, customer_support, warehouse, vendor, ca, employee, investor]
        companyIds:
          type: array
          items:
            type: integer

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
