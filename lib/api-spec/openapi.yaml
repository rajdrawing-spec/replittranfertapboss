  /inventory/warehouse-summary:
    get:
      operationId: getWarehouseSummary
      tags: [inventory]
      summary: Stock value and counts by warehouse/company
      responses:
        "200":
          description: Warehouse summary
          content:
            application/json:
              schema:
                type: array
                items:
